<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Message Sent | G Srinivas</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background: #080808;

            color: white;

            padding: 20px;
        }

        .box {
            max-width: 550px;

            width: 100%;

            text-align: center;

            padding: 50px 30px;

            background: #121212;

            border: 1px solid #292929;

            border-radius: 12px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.5);
        }

        .check {
            width: 70px;

            height: 70px;

            margin:
                0 auto 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #ff6a00;

            color: white;

            font-size: 35px;

            font-weight: bold;
        }

        h1 {
            font-size: 32px;

            margin-bottom: 15px;
        }

        h1 span {
            color: #ff6a00;
        }

        p {
            color: #888;

            font-size: 14px;

            line-height: 1.8;

            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;

            padding: 13px 25px;

            background: #ff6a00;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;

            transition: 0.3s;
        }

        .btn:hover {
            background: #ff8500;

            transform:
                translateY(-3px);
        }

    </style>

</head>

<body>

    <div class="box">

        <div class="check">
            ✓
        </div>

        <h1>
            Message <span>Sent!</span>
        </h1>

        <p>
            Thank you for contacting me.
            Your message has been received successfully.
            I will get back to you soon.
        </p>

        <a href="/" class="btn">
            ← Back to Portfolio
        </a>

    </div>

</body>

</html>
